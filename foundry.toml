[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./" }]
ffi = false

[fuzz]
runs = 512
fail_on_revert = true

[invariant]
runs = 256
depth = 32
fail_on_revert = true

[profile.ci]
fuzz = { runs = 2000 }
invariant = { runs = 512, depth = 48 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
quote_style = "double"

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
