[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Remappings enter every artifact's CBOR metadata, hence every CREATE2/CREATE3 address (Create3Deployer, libraries,
# FundFactoryV6 pinned in script/solana-v6-addresses.json). remappings.txt lists the full set of a recursive submodule
# checkout and auto-detection is off, so a partial lib checkout cannot silently move a deterministic address.
auto_detect_remappings = false
script = "script"
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./cache/sol-t11" }]
ffi = false
# CR-19: the test EVM's per-test gas cap (Foundry default 2^30). Deploying both full v6 stacks plus a Fund inside one
# test (SolanaThreeChainCreation all-three: ~1.15e9 gas; SolanaV6Deployment fork: ~1.0e9) exceeds it with MemoryOOG.
# Chain limits are asserted separately (Fund creation fitness test vs Arbitrum's 32M per-tx cap).
gas_limit = "18446744073709551615"

[fuzz]
runs = 512
fail_on_revert = true

[invariant]
runs = 256
depth = 32
fail_on_revert = true

[profile.ci]
fuzz = { runs = 2000 }
invariant = { runs = 512, depth = 48 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
quote_style = "double"

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
