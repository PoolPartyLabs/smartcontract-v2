name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci
  ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
  ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Unit tests
        run: forge test --no-match-path "test/fork/**" -vvv
      - name: Fork tests
        run: forge test --match-path "test/fork/**" -vvv
