name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci
  # Pinned to the version the repository is formatted and sized with; `stable` moved to a release whose `forge fmt`
  # disagrees with ours, which failed every run (independent review 2026-09-30, process finding).
  FOUNDRY_VERSION: v1.7.1

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Format
        run: forge fmt --check
      - name: Build (fails above the EIP-170 size limit)
        run: forge build --sizes
      - name: Unit, fuzz, invariant and security suites
        run: forge test --no-match-path "test/{fork/**,review/**/*Fork*}" -vvv

  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Compiled before any pin is taken, so the compile does not spend the RPCs' state window.
      - name: Build
        id: build
        run: forge build
      # The fork suites read ARBITRUM_FORK_BLOCK and ROBINHOOD_FORK_BLOCK. Public RPCs serve recent state only: the
      # Robinhood Chain node about 10 minutes of it (6,000 to 8,000 blocks, measured 2026-10-02), arb1.arbitrum.io about
      # 30. The fork suite as one run takes about 10 minutes and outlasted the Robinhood window, so it runs in shards,
      # each pinned at latest - 300 right before it starts. The shard paths are complementary, their union is
      # test/{fork/**,review/**/*Fork*}, so a new fork suite cannot fall outside them; the two longest suites
      # (UniswapV3SwapAdapter, DepthProbe, about 5 minutes each) get a shard of their own. Every shard runs even when an
      # earlier one failed. An archive RPC in the secrets serves any pin, so fresh pins work there too.
      # The scenario suites (EndToEndBase's scenario clock: they warp a fork, then switch to the other) run in a
      # process of their own. forge test hands every fork of one url and block the block env last left on any of
      # them, so their warps reach the forks other suites create in the same run (with -j 1, UnwindAttackFork reads
      # a stale ETH / USD price after DeprecatedAdapterFork). A new suite on EndToEndBase belongs in shard 3.
      - name: "Fork shard 1/5: test/fork, except swap and the scenario suites"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          arbitrum=$(cast block-number --rpc-url "$ARBITRUM_RPC_URL")
          robinhood=$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")
          export ARBITRUM_FORK_BLOCK=$((arbitrum - 300)) ROBINHOOD_FORK_BLOCK=$((robinhood - 300))
          echo "fork pins: ARBITRUM_FORK_BLOCK=$ARBITRUM_FORK_BLOCK ROBINHOOD_FORK_BLOCK=$ROBINHOOD_FORK_BLOCK"
          forge test --match-path "test/fork/**" --no-match-path "test/fork/{swap,e2e,security}/**" -j 2 -vvv
      - name: "Fork shard 2/5: test/fork/swap"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          arbitrum=$(cast block-number --rpc-url "$ARBITRUM_RPC_URL")
          robinhood=$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")
          export ARBITRUM_FORK_BLOCK=$((arbitrum - 300)) ROBINHOOD_FORK_BLOCK=$((robinhood - 300))
          echo "fork pins: ARBITRUM_FORK_BLOCK=$ARBITRUM_FORK_BLOCK ROBINHOOD_FORK_BLOCK=$ROBINHOOD_FORK_BLOCK"
          forge test --match-path "test/fork/swap/**" -j 2 -vvv
      - name: "Fork shard 3/5: scenario suites"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          arbitrum=$(cast block-number --rpc-url "$ARBITRUM_RPC_URL")
          robinhood=$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")
          export ARBITRUM_FORK_BLOCK=$((arbitrum - 300)) ROBINHOOD_FORK_BLOCK=$((robinhood - 300))
          echo "fork pins: ARBITRUM_FORK_BLOCK=$ARBITRUM_FORK_BLOCK ROBINHOOD_FORK_BLOCK=$ROBINHOOD_FORK_BLOCK"
          forge test -j 2 -vvv --match-path "test/{fork/e2e/**,fork/security/**,review/integration-xchain/**/*Fork*,review/integration-price/DeprecatedAdapterFork.t.sol,review/integration-price/SpokeReportSpotFork.t.sol}"
      - name: "Fork shard 4/5: review integration-price, except the scenario suites"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          arbitrum=$(cast block-number --rpc-url "$ARBITRUM_RPC_URL")
          robinhood=$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")
          export ARBITRUM_FORK_BLOCK=$((arbitrum - 300)) ROBINHOOD_FORK_BLOCK=$((robinhood - 300))
          echo "fork pins: ARBITRUM_FORK_BLOCK=$ARBITRUM_FORK_BLOCK ROBINHOOD_FORK_BLOCK=$ROBINHOOD_FORK_BLOCK"
          forge test -j 2 -vvv --match-path "test/review/integration-price/**/*Fork*" \
            --no-match-path "test/review/integration-price/{DeprecatedAdapterFork,SpokeReportSpotFork}.t.sol"
      - name: "Fork shard 5/5: review, except integration-price and integration-xchain"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          arbitrum=$(cast block-number --rpc-url "$ARBITRUM_RPC_URL")
          robinhood=$(cast block-number --rpc-url "$ROBINHOOD_RPC_URL")
          export ARBITRUM_FORK_BLOCK=$((arbitrum - 300)) ROBINHOOD_FORK_BLOCK=$((robinhood - 300))
          echo "fork pins: ARBITRUM_FORK_BLOCK=$ARBITRUM_FORK_BLOCK ROBINHOOD_FORK_BLOCK=$ROBINHOOD_FORK_BLOCK"
          forge test -j 2 -vvv --match-path "test/review/**/*Fork*" \
            --no-match-path "test/review/{integration-price,integration-xchain}/**"
