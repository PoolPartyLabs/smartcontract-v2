name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci
  # Pinned to the version the repository is formatted and sized with; `stable` moved to a release whose `forge fmt`
  # disagrees with ours, which failed every run (independent review 2026-09-30, process finding).
  FOUNDRY_VERSION: v1.7.1

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Format
        run: forge fmt --check
      - name: Build (fails above the EIP-170 size limit)
        run: forge build --sizes
      - name: Unit, fuzz, invariant and security suites
        run: forge test --no-match-path "test/{fork/**,review/**/*Fork*}" -vvv

  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # The fork suites read ARBITRUM_FORK_BLOCK and ROBINHOOD_FORK_BLOCK; unset, every fork setUp reverted. Public
      # RPCs serve recent state only, so the pins are taken from the latest block at run time (an archive RPC in the
      # secrets lets them be fixed instead).
      - name: Pin fork blocks
        run: |
          echo "ARBITRUM_FORK_BLOCK=$(( $(cast block-number --rpc-url "$ARBITRUM_RPC_URL") - 300 ))" >> "$GITHUB_ENV"
          echo "ROBINHOOD_FORK_BLOCK=$(( $(cast block-number --rpc-url "$ROBINHOOD_RPC_URL") - 300 ))" >> "$GITHUB_ENV"
      - name: Fork suites
        run: forge test --match-path "test/{fork/**,review/**/*Fork*}" -j 2 -vvv
